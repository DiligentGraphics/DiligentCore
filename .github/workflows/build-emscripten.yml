name: Emscripten build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os:         ["windows-2025", "ubuntu-26.04", "macos-26"]
        build_type: ["Debug", "Release"]

        exclude:
          # Exclude MacOS-Release
          - os:         "macos-26"
            build_type: "Release"

        include:
          - os:        "windows-2025"
            host_name: "Win10"
            cmake_args: "-DDILIGENT_BUILD_CORE_TESTS=ON -DDILIGENT_EMSCRIPTEN_STRIP_DEBUG_INFO=ON"

          - os:        "ubuntu-26.04"
            host_name: "Linux"
            cmake_args: "-DDILIGENT_BUILD_CORE_TESTS=ON -DDILIGENT_EMSCRIPTEN_STRIP_DEBUG_INFO=ON"

          - os:        "macos-26"
            host_name: "MacOS"
            cmake_args: "-DDILIGENT_BUILD_CORE_TESTS=ON -DDILIGENT_BUILD_CORE_INCLUDE_TEST=ON"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.host_name }} -> Emscripten, ${{ matrix.build_type }}

    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up build environment
      if:   success()
      uses: DiligentGraphics/github-action/setup-build-env@v28
      with:
        platform: Web

    - name: Configure CMake
      if:   success()
      uses: DiligentGraphics/github-action/configure-cmake@v28
      with:
        build-type: ${{ matrix.build_type }}
        cmake-args: ${{ matrix.cmake_args }}

    - name: Build
      if:   success()
      uses: DiligentGraphics/github-action/build@v28

    - name: Test WebGPU in Chrome
      if: runner.os == 'Linux'
      timeout-minutes: 20
      shell: bash
      run: |
        python3 Tests/DiligentCoreAPITest/browser/run_tests.py \
          --module "$DILIGENT_BUILD_DIR/Tests/DiligentCoreAPITest/DiligentCoreAPITest.js" \
          --browser "$(command -v google-chrome)" \
          --output BrowserTestResults

    - name: Upload browser GPU test results
      if: ${{ always() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@v7
      with:
        name: WebGPU-Chrome-${{matrix.build_type}}
        path: BrowserTestResults
        if-no-files-found: warn
