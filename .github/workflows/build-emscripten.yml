name: Emscripten build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os:         ["windows-2025", "ubuntu-26.04", "macos-26"]
        build_type: ["Debug", "Release"]

        exclude:
          # Exclude MacOS-Release
          - os:         "macos-26"
            build_type: "Release"

        include:
          - os:        "windows-2025"
            host_name: "Win10"
            cmake_args: "-DDILIGENT_BUILD_CORE_TESTS=ON -DDILIGENT_EMSCRIPTEN_STRIP_DEBUG_INFO=ON"

          - os:        "ubuntu-26.04"
            host_name: "Linux"
            cmake_args: "-DDILIGENT_BUILD_CORE_TESTS=ON -DDILIGENT_EMSCRIPTEN_STRIP_DEBUG_INFO=ON"

          - os:        "macos-26"
            host_name: "MacOS"
            cmake_args: "-DDILIGENT_BUILD_CORE_TESTS=ON -DDILIGENT_BUILD_CORE_INCLUDE_TEST=ON -DDILIGENT_EMSCRIPTEN_STRIP_DEBUG_INFO=ON"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.host_name }} -> Emscripten, ${{ matrix.build_type }}

    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up build environment
      if:   success()
      uses: DiligentGraphics/github-action/setup-build-env@v33
      with:
        platform: Web

    - name: Configure CMake
      if:   success()
      uses: DiligentGraphics/github-action/configure-cmake@v33
      with:
        build-type: ${{ matrix.build_type }}
        cmake-args: ${{ matrix.cmake_args }}

    - name: Build
      if:   success()
      id:   build
      uses: DiligentGraphics/github-action/build@v33

    - name: Test Core CPU in Chrome
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      timeout-minutes: 20
      uses: DiligentGraphics/github-action/run-core-cpu-browser-tests@v33
      with:
        artifact-name: CoreCPU-Chrome-${{runner.os}}-${{matrix.build_type}}

    - name: Test WebGPU in Chrome
      if: ${{ !cancelled() && runner.os != 'macOS' && steps.build.outcome == 'success' }}
      timeout-minutes: 20
      uses: DiligentGraphics/github-action/run-core-browser-tests@v33
      with:
        artifact-name: WebGPU-Chrome-${{runner.os}}-${{matrix.build_type}}
