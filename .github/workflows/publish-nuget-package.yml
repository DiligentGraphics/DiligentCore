name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'
      - 'API*'
  workflow_dispatch:

env:
  MSBuildEnableWorkloadResolver: false
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'

jobs:
  deploy:
    runs-on: windows-2025
    name: Deploying NuGet package
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install python packages
      working-directory: ${{github.workspace}}
      run: python -m pip install -r ./BuildTools/.NET/requirements.txt
         
    - name: Build and run
      working-directory: ${{github.workspace}}
      run:  python ./BuildTools/.NET/dotnet-build-package.py -c Release -s ./BuildTools/.NET/dotnet-build-settings.json -d ./ --dotnet-publish

    - name: Authenticate to NuGet
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{vars.NUGET_USER}}

    - name: Publish NuGet package
      run: dotnet nuget push *.nupkg --api-key "$env:NUGET_API_KEY" --source "$env:NUGET_SOURCE_URL"
      working-directory: ${{github.workspace}}/build/.NET/Graphics/GraphicsEngine.NET/bin/Release
      env:
        NUGET_API_KEY: ${{steps.nuget_login.outputs.NUGET_API_KEY}}
